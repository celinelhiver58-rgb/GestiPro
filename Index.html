
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GestiPro - Gestion commerciale</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #172033;
    }
    header {
      background: #123b70;
      color: white;
      padding: 25px;
      text-align: center;
    }
    main {
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px #ddd;
    }
    h2 { color: #123b70; }
  </style>
</head>
<body>
  <header>
    <h1>GestiPro</h1>
    <p>Gérez votre commerce simplement</p>
  </header>

  <main>
    <h2>Tableau de bord</h2>

    <div class="card">
      <h3>Bienvenue sur GestiPro !</h3>
      <p>Votre gestion commerciale commence ici.</p>
    </div>

    <div class="card">
      <h3>Produits</h3>
      <p>Gérez vos produits et votre stock.</p>
    </div>

    <div class="card">
      <h3>Ventes</h3>
      <p>Suivez vos ventes quotidiennes.</p>
    </div>

    <div class="card">
      <h3>Dépenses</h3>
      <p>Suivez les dépenses de votre commerce.</p>
    </div>
  </main>
</body>
</html>
