<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123b70">
  <meta name="description" content="GestiPro : application simple de gestion commerciale.">
  <title>GestiPro - Gestion commerciale</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #172033;
      line-height: 1.5;
    }
    header {
      background: #123b70;
      color: #fff;
      padding: 24px 18px;
      text-align: center;
    }
    header h1 { margin: 0 0 5px; font-size: 1.8rem; }
    header p { margin: 0; }
    main {
      width: min(100% - 28px, 1000px);
      margin: 22px auto 40px;
    }
    footer {
      text-align: center;
      padding: 18px;
      color: #64748b;
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>GestiPro</h1>
    <p>Gérez votre commerce simplement</p>
  </header>

  <main aria-label="Tableau de bord GestiPro">
    <!-- Le tableau de bord interactif est ajouté par app.js. -->
  </main>

  <footer>GestiPro — Gestion commerciale</footer>

  <script src="app.js" defer></script>
</body>
</html>
